# Tests on Linux and Windows, and one binary per platform as a build artifact.
# Nothing is published from here: releases are made by hand.
#
# Not yet run: written without access to GitHub Actions. The first run will
# show whether the Windows job and the system packages below are right.
name: build

on:
  push:
    branches: [main, feature/windows, spike/usbip]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries Qt needs without a display
        # The package mirrors are sometimes unreachable for a moment: apt retries
        # each download, and the whole step is tried three times. It still fails
        # if the packages cannot be installed.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update \
               && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                    libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1; then
              exit 0
            fi
            echo "apt failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - run: python -m pip install --disable-pip-version-check "PySide6-Essentials>=6.5"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "PySide6-Essentials>=6.5"
      # Only what is meant to run on Windows; the other tests drive Linux tools.
      - name: Tests of the Windows side
        env:
          QT_QPA_PLATFORM: offscreen
          QUADSENS_PLATFORM: windows
        run: python -m unittest tests.test_windows_logic tests.test_windows_ui tests.test_colors tests.test_diagram tests.test_steps tests.test_usbip_spike tests.test_usbip_windows

  build-linux:
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quadsens-linux
          path: dist/quadsens
          if-no-files-found: error

  build-windows:
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: quadsens-windows
          path: dist/quadsens.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: quadsens-usbip-spike-windows
          path: dist/quadsens-usbip-spike.exe
          if-no-files-found: error
