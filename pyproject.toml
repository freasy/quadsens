[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quadsens"
version = "0.1.0"
description = "Desktop bridge that carries a per-direction mouse sensitivity calibration into the yeetmouse driver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
quadsens = "quadsens.__main__:main"

[tool.setuptools]
packages = ["quadsens", "quadsens.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
