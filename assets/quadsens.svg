<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#1e293b"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <g stroke="#2dd4bf" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="32" x2="46" y2="32"/>
    <line x1="32" y1="32" x2="22" y2="32"/>
    <line x1="32" y1="32" x2="32" y2="45"/>
    <line x1="32" y1="32" x2="32" y2="21"/>
  </g>
  <g fill="#2dd4bf">
    <polygon points="57,32 45,24.5 45,39.5"/>
    <polygon points="12,32 23,25.5 23,38.5"/>
    <polygon points="32,55 25,44 39,44"/>
    <polygon points="32,10 25.5,21 38.5,21"/>
  </g>
  <circle cx="32" cy="32" r="4.5" fill="#f8fafc"/>
</svg>
