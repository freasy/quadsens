<?xml version="1.0" encoding="UTF-8"?>
<!-- QuadSens application icon. Four arrows of slightly different length
     around a centre point: one sensitivity multiplier per direction.
     Black tile with a lighter edge, red arrows, as in the default theme.
     SPDX-License-Identifier: GPL-3.0-or-later -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#df5c6d"/>
      <stop offset="0.45" stop-color="#d7263d"/>
      <stop offset="1" stop-color="#d7263d"/>
    </linearGradient>
  </defs>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#tile)" stroke="#5a5a63" stroke-width="2"/>
  <!-- right (longest), left (shortest), down, up: each one closed shape -->
  <path fill="url(#red)" d="M32 28 H45 V22.5 L57.5 32 L45 41.5 V36 H32 Z"/>
  <path fill="url(#red)" d="M32 28 H24 V23.5 L12.5 32 L24 40.5 V36 H32 Z"/>
  <path fill="url(#red)" d="M28 32 V44 H22.5 L32 55.5 L41.5 44 H36 V32 Z"/>
  <path fill="url(#red)" d="M28 32 V23 H23 L32 10.5 L41 23 H36 V32 Z"/>
  <circle cx="32" cy="32" r="3.6" fill="#0b0b0d"/>
</svg>
